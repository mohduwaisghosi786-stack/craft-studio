name: Build Windows EXE & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pypdf reportlab

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "templates;templates" --name "UWAIS-Internet-Cafe-Studio" app.py

      - name: Compress Windows Build
        run: |
          powershell Compress-Archive -Path dist/UWAIS-Internet-Cafe-Studio -DestinationPath dist/UWAIS-Internet-Cafe-Studio-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UWAIS-Internet-Cafe-Studio-Windows
          path: dist/UWAIS-Internet-Cafe-Studio-Windows.zip
